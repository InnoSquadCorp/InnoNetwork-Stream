version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      codeql-actions:
        applies-to: version-updates
        patterns: ["github/codeql-action/*"]
      codeql-security:
        applies-to: security-updates
        patterns: ["github/codeql-action/*"]
