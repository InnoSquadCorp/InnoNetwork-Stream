name: CI
run-name: >-
  ${{ (github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) && 'CI metadata only' || 'CI' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) && format('metadata-{0}', github.run_id) || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-plan:
    name: CI Plan
    if: ${{ !(github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan exact changed paths
        id: plan
        run: python3 -B Scripts/ci-policy.py plan --event "$GITHUB_EVENT_PATH" --output .build/ci-plan.json

  policy:
    name: CI Policy
    needs: ci-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify planning and workflow contracts
        run: |
          python3 -B -m unittest discover -s Scripts/automation-tests -v
          python3 -B Scripts/check-ci-workflows.py

  dependency-review:
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.dependency-review
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown

  lint:
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.lint
    name: Lint (swift-format)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout InnoNetwork-Stream
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app
      - name: Run swift-format lint
        run: bash Scripts/format.sh --lint

  build-and-test:
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.build-and-test
    name: Build and Test (SwiftPM) — Xcode ${{ matrix.xcode.label }}
    runs-on: ${{ matrix.xcode.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        xcode:
          - label: "26.0.1"
            runner: macos-15
            path: /Applications/Xcode_26.0.1.app
          - label: "27.0"
            runner: xcode-27
            path: /Applications/Xcode.app
    steps:
      - name: Checkout InnoNetwork-Stream
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s ${{ matrix.xcode.path }}
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Verify published InnoNetwork dependency
        run: bash Scripts/check_innonetwork_dependency.sh
      - name: Verify dependency lock did not drift
        run: git diff --exit-code -- Package.resolved
      - name: Run tests
        run: xcrun swift test --force-resolved-versions --parallel

  contracts:
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.contracts
    name: Docs / API / HLS Contract
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout InnoNetwork-Stream
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Verify published InnoNetwork dependency
        run: bash Scripts/check_innonetwork_dependency.sh
      - name: Validate scripts and documentation
        run: |
          bash -n Scripts/*.sh Scripts/tests/*.sh
          python3 -m py_compile Scripts/*.py
          bash Scripts/tests/test_check_innonetwork_dependency.sh
          bash Scripts/tests/test_validate_docs_release_state.sh
          bash Scripts/tests/test_validate_release_candidate.sh
          bash Scripts/tests/test_validate_release_ref.sh
          bash Scripts/tests/test_validate_hls_with_apple_tools.sh
          bash Scripts/tests/test_package_identity.sh
          bash Scripts/validate_docs_release_state.sh --expect draft
      - name: Validate public API
        run: bash Scripts/check_public_api_contract.sh
      - name: Run HLS contract gates
        run: bash Scripts/run_hls_quality_gates.sh

  platform-build:
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.platform-build
    name: Apple Platform Build (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: macOS
            runner: macos-15
            builder: xcodebuild
            destination: platform=macOS
          - runtime: iOS
            runner: macos-15
            builder: xcodebuild
            destination: generic/platform=iOS Simulator
          - runtime: tvOS
            runner: macos-15
            builder: swiftpm-cross
            sdk: appletvos
            triple: arm64-apple-tvos16.0
          - runtime: watchOS
            runner: macos-15
            builder: swiftpm-cross
            sdk: watchos
            triple: arm64_32-apple-watchos9.0
          - runtime: visionOS
            runner: macos-15
            builder: swiftpm-cross
            sdk: xros
            triple: arm64-apple-xros1.0
    steps:
      - name: Checkout InnoNetwork-Stream
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app
      - name: Verify published InnoNetwork dependency
        run: bash Scripts/check_innonetwork_dependency.sh
      - name: Build with xcodebuild
        if: matrix.builder == 'xcodebuild'
        run: |
          xcodebuild \
            -scheme InnoNetwork-Stream-Package \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath '.build/platform-${{ matrix.runtime }}' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build with SwiftPM cross compilation
        if: matrix.builder == 'swiftpm-cross'
        run: |
          bash Scripts/build_apple_platform_targets.sh \
            '${{ matrix.runtime }}' \
            '${{ matrix.sdk }}' \
            '${{ matrix.triple }}' \
            '.build/platform-${{ matrix.runtime }}'

  codeql:
    name: CodeQL
    needs: ci-plan
    if: fromJSON(needs.ci-plan.outputs.plan).jobs.codeql
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  ci-required:
    name: ${{ (github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) && 'CI Metadata Only' || 'CI Required' }}
    if: ${{ always() && !(github.event_name == 'pull_request' && (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'release-validation') || (github.event.action == 'edited' && !github.event.changes.base))) }}
    needs: ['ci-plan', 'policy', 'dependency-review', 'lint', 'build-and-test', 'contracts', 'platform-build', 'codeql']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every selected validation
        env:
          CI_PLAN: ${{ needs.ci-plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B Scripts/ci-policy.py evaluate
