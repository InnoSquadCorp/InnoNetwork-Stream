name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Release
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Validate release scripts
        run: |
          bash -n Scripts/*.sh Scripts/tests/*.sh
          python3 -m py_compile Scripts/*.py
          bash Scripts/tests/test_validate_docs_release_state.sh
          bash Scripts/tests/test_validate_release_candidate.sh
          bash Scripts/tests/test_validate_release_ref.sh
          bash Scripts/tests/test_validate_hls_with_apple_tools.sh
      - name: Validate tagged release ref
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TAG_REF: ${{ github.ref }}
          RELEASE_REMOTE: origin
          RELEASE_MAIN_REF: refs/remotes/origin/main
          RELEASE_FETCH_MAIN: '1'
        run: bash Scripts/validate_release_ref.sh
      - name: Validate manual release candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_CANDIDATE_REF: ${{ github.sha }}
          RELEASE_REMOTE: origin
          RELEASE_MAIN_REF: refs/remotes/origin/main
          RELEASE_FETCH_MAIN: '1'
        run: bash Scripts/validate_release_candidate.sh
      - name: Run full release preflight
        run: bash Scripts/run_local_release_preflight.sh --full
      - name: Prepare tagged source archive
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p .build/release-artifacts
          archive=".build/release-artifacts/InnoStream-$RELEASE_TAG.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="InnoStream-$RELEASE_TAG/" \
            --output="$archive" \
            "$RELEASE_TAG"
          (cd .build/release-artifacts && shasum -a 256 "$(basename "$archive")" > SHA256SUMS)
      - name: Upload release validation artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: InnoStream-${{ github.ref_name }}-release-artifacts
          path: |
            .build/release-artifacts/InnoStream-${{ github.ref_name }}.tar.gz
            .build/release-artifacts/SHA256SUMS
            .build/local-release-preflight/apple-hls/
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "InnoStream $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            ".build/release-artifacts/InnoStream-$RELEASE_TAG.tar.gz" \
            .build/release-artifacts/SHA256SUMS
